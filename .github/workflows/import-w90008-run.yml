name: One-time exact RUN import

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-w90008-run.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GameYard
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import pinned source revision
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$(mktemp -d)"
          git clone --quiet https://github.com/w90008/-.git "$source_dir"
          git -C "$source_dir" checkout --quiet 0e68f1288d08d41e09ae14fad1f7a59ceab66f39
          test "$(git -C "$source_dir" rev-parse HEAD)" = "0e68f1288d08d41e09ae14fad1f7a59ceab66f39"

          rm -rf README.md appcache_manifest_generator.py cache.manifest document offsets payloads poops.html poops.js readme.png slopkit ui

          git -C "$source_dir" ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              index.html) continue ;;
            esac
            mkdir -p "$(dirname "$file")"
            cp "$source_dir/$file" "$file"
          done

          expected="$(git -C "$source_dir" ls-files | awk '$0 != "index.html" {n++} END {print n+0}')"
          actual="$(git -C "$source_dir" ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              index.html) continue ;;
            esac
            cmp --silent "$source_dir/$file" "$file"
            printf x
          done | wc -c)"
          test "$expected" -eq 103
          test "$actual" -eq "$expected"

      - name: Commit exact imported files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GameYard Import Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A README.md appcache_manifest_generator.py cache.manifest document offsets payloads poops.html poops.js readme.png slopkit ui
          git commit -m "Import exact RUN files from w90008"
          git push origin HEAD:main
