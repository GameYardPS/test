    .shell:before{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(circle at 50% 42%,rgba(84,214,41,.14),rgba(0,0,0,.12) 48%,rgba(0,0,0,.5) 100%);pointer-events:none}
    header,main,footer{position:relative;z-index:1}
    header{direction:ltr;display:flex;align-items:center;justify-content:space-between;padding:24px clamp(20px,4vw,56px)}
    .brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none}
    .mark{display:block;width:44px;height:44px;overflow:hidden;border:2px solid rgba(126,226,75,.85);border-radius:50%;background:#152118;box-shadow:0 10px 28px rgba(52,181,17,.28)}
    .mark img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 28%}
    .brand-copy{display:flex;flex-direction:column;line-height:1.05}
    .brand-copy strong{font-size:18px;letter-spacing:.2px}
    .brand-copy small{margin-top:5px;color:rgba(255,255,255,.68);font-size:10px;letter-spacing:2px;text-transform:uppercase}
    .chip{padding:9px 14px;border:1px solid rgba(255,255,255,.18);border-radius:999px;color:#fff;background:rgba(5,13,8,.66);font-size:12px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.2)}
    main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
    .hero{width:min(760px,100%);padding:clamp(28px,5vw,56px);text-align:center;border:1px solid rgba(255,255,255,.16);border-radius:30px;background:rgba(5,12,7,.62);box-shadow:0 28px 70px rgba(0,0,0,.38)}
    .eyebrow{display:inline-flex;align-items:center;gap:9px;margin:0 0 12px;color:#a9ff70;font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase}
    .eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:#62d72d;box-shadow:0 0 0 5px rgba(98,215,45,.14)}
    h1{margin:0;color:#fff;font-size:clamp(42px,8vw,78px);font-weight:900;line-height:.95;letter-spacing:-2.8px}
    .lede{max-width:620px;margin:18px auto 8px;color:#e8f0e9;font-size:clamp(15px,2.1vw,19px);font-weight:700;line-height:1.9}
    .phone{direction:ltr;display:inline-block;margin:3px 0 25px;color:#b6ff84;font-size:clamp(25px,4vw,36px);font-weight:900;letter-spacing:1px;text-decoration:none}
    .phone:hover,.phone:focus{color:#e0ffc9;text-decoration:underline}
    .run{direction:ltr;display:inline-flex;align-items:center;justify-content:center;gap:14px;min-width:min(300px,100%);padding:18px 30px;border:0;border-radius:17px;color:#fff;background:linear-gradient(180deg,#ff5257,#ea272e);font-size:22px;font-weight:900;letter-spacing:3px;text-decoration:none;box-shadow:0 16px 36px rgba(234,39,46,.34),inset 0 1px rgba(255,255,255,.3);transition:transform .16s ease,filter .16s ease}
    .run:hover,.run:focus{transform:translateY(-2px);filter:brightness(1.08)}
    .run span{display:grid;place-items:center;width:29px;height:29px;border-radius:50%;background:#fff;color:#ef3037;font-size:15px;letter-spacing:0}
    .status{direction:ltr;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;color:rgba(255,255,255,.76);font-size:12px;font-weight:700}
    .status i{width:8px;height:8px;border-radius:50%;background:#59d927;box-shadow:0 0 0 5px rgba(89,217,39,.14)}
    footer{direction:ltr;padding:16px 24px 24px;text-align:center;color:rgba(255,255,255,.55);font-size:10px;letter-spacing:1.5px;text-transform:uppercase}
    @media(max-width:520px){header{padding:17px 16px}.mark{width:40px;height:40px;border-radius:12px}.brand-copy small{display:none}.chip{padding:8px 10px}.hero{padding:30px 18px;border-radius:23px}h1{font-size:46px;letter-spacing:-2px}.run{min-width:100%;padding:17px 22px}footer{padding-bottom:18px}}
    @media(max-height:700px) and (min-width:521px){header{padding-top:16px;padding-bottom:8px}.hero{padding:27px 40px}.lede{margin-top:12px;line-height:1.65}.phone{margin-bottom:18px}.run{padding-top:14px;padding-bottom:14px}footer{padding-top:8px;padding-bottom:12px}}
    @media(prefers-reduced-motion:reduce){.run{transition:none}}
  </style>
</head>

        <span class="brand-copy"><strong>GameYard</strong><small>Gaming Center</small></span>

      <section class="hero" aria-labelledby="title">
        <p class="eyebrow">GameYard Store</p>
        <h1 id="title">GameYard</h1>
        <p class="lede">كل ما تحتاجه من أجهزة الألعاب والإلكترونيات وملحقاتها في مكان واحد.</p>

        <div><a class="run" href="./slopkit/poops.html?go=1&amp;auto=1&amp;trigger=netcontrol&amp;payload=1&amp;v=17"><span>▶</span>RUN</a></div>
        <div class="status" id="cache-status"><i></i><span>PREPARING OFFLINE CACHE...</span></div>
      </section>

  </div>
  <script>
    (function(){
      var status=document.getElementById('cache-status');
      var label=status?status.getElementsByTagName('span')[0]:null;
      function setStatus(text){if(label){label.textContent=text;}}
      var runButton=document.querySelector('.run');
      var localRun='./slopkit/poops.html?go=1&auto=1&trigger=netcontrol&payload=1&v=17';
      function ready(){setStatus(navigator.onLine===false?'OFFLINE MODE • RUN READY':'FULL OFFLINE READY');}
      function updateNetworkStatus(){
        if(navigator.onLine===false){setStatus('OFFLINE MODE');}
        else if(document.documentElement.getAttribute('data-offline-ready')==='yes'){setStatus('FULL OFFLINE READY');}
      }
      window.addEventListener('online',updateNetworkStatus);
      window.addEventListener('offline',updateNetworkStatus);
      if('serviceWorker' in navigator){
        window.addEventListener('load',function(){
          navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(function(){
            return navigator.serviceWorker.ready;
          }).then(function(){
            document.documentElement.setAttribute('data-offline-ready','yes');
            if(runButton){runButton.setAttribute('href',localRun);}
            ready();
          }).catch(function(){setStatus('BROWSER CACHE ACTIVE');});
        });
      }else if(window.applicationCache){
        window.applicationCache.addEventListener('cached',function(){
          document.documentElement.setAttribute('data-offline-ready','yes');
          ready();
        });
        window.applicationCache.addEventListener('updateready',function(){
          document.documentElement.setAttribute('data-offline-ready','yes');
          ready();
        });
        window.applicationCache.addEventListener('noupdate',function(){
          document.documentElement.setAttribute('data-offline-ready','yes');
          ready();
        });
        window.applicationCache.addEventListener('error',function(){setStatus('BROWSER CACHE ACTIVE');});
      }else{
        setStatus('BROWSER CACHE ACTIVE');
      }
    }());
  </script>
</body>
</html>
