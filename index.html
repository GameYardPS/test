<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eef0f4">
  <title>GameYard PS Host</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,"Segoe UI",sans-serif}
    body{color:#111522;background:radial-gradient(circle at 50% 30%,#fff 0,#f5f6f8 39%,#e2e5eb 78%,#d8dce4 100%)}
    .shell{position:relative;min-height:100vh;overflow:hidden;display:flex;flex-direction:column}
    .shell:before,.shell:after{content:"";position:absolute;z-index:0;width:330px;height:330px;border-radius:50%;filter:blur(10px);opacity:.16}
    .shell:before{top:-210px;left:-120px;background:#657dff}
    .shell:after{right:-170px;bottom:-210px;background:#ff6267}
    header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:25px clamp(20px,5vw,68px)}
    .brand{display:flex;align-items:center;gap:11px;color:#111522;text-decoration:none}
    .mark{display:flex;align-items:center;justify-content:center;width:39px;height:39px;border-radius:11px;color:white;background:linear-gradient(145deg,#7acb25,#286817);box-shadow:0 8px 18px rgba(18,35,18,.24);font-size:19px;font-weight:900}
    .brand-copy{display:flex;flex-direction:column;line-height:1}
    .brand-copy strong{font-size:14px;letter-spacing:.18em}
    .brand-copy small{margin-top:5px;color:#687184;font-size:9px;font-weight:700;letter-spacing:.28em}
    .chip{display:flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid rgba(25,30,42,.1);border-radius:999px;color:#51596a;background:rgba(255,255,255,.6);font-size:11px;font-weight:800;letter-spacing:.09em}
    .chip i,.status i{width:7px;height:7px;border-radius:50%;background:#1b9b61;box-shadow:0 0 0 4px rgba(27,155,97,.12)}
    main{position:relative;z-index:1;display:flex;min-height:calc(100vh - 92px);flex-direction:column;align-items:center;justify-content:center;padding:24px 20px 82px;text-align:center}
    .visual{width:min(360px,82vw);aspect-ratio:16/9;overflow:hidden;border:3px solid #26334b;border-radius:22px;background:#65c729;box-shadow:0 22px 48px rgba(36,43,58,.24),0 3px 12px rgba(44,50,64,.15)}
    .visual img{display:block;width:100%;height:100%;object-fit:cover}
    .eyebrow{display:flex;align-items:center;gap:8px;margin-top:27px;color:#7d8493;font-size:10px;font-weight:800;letter-spacing:.22em}
    .eyebrow i{width:20px;height:1px;background:#a6adba}
    h1{margin:10px 0 0;font-size:clamp(31px,4.2vw,46px);font-weight:850;letter-spacing:-.045em}
    .lede{margin:9px 0 23px;color:#687184;font-size:clamp(13px,1.6vw,16px)}
    .run{display:inline-flex;min-width:218px;min-height:59px;align-items:center;justify-content:center;gap:12px;padding:17px 32px;border:1px solid rgba(255,255,255,.4);border-radius:16px;color:#fff;background:linear-gradient(135deg,#ff4a48 0,#e83234 44%,#ae101d 100%);box-shadow:0 16px 34px rgba(186,20,31,.3),inset 0 1px rgba(255,255,255,.35);font-size:18px;font-weight:900;letter-spacing:.16em;text-decoration:none;transition:transform .16s ease,box-shadow .16s ease}
    .run:hover,.run:focus{transform:translateY(-3px);box-shadow:0 21px 42px rgba(186,20,31,.37),0 0 0 4px rgba(232,50,52,.12);outline:none}
    .run:active{transform:translateY(1px)}
    .play{display:flex;width:24px;height:24px;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.16);font-size:10px;letter-spacing:0}
    .status{display:flex;align-items:center;gap:9px;margin-top:16px;color:#7b8494;font-size:11px;font-weight:700;letter-spacing:.08em}
    .status i{background:#8b94a3;box-shadow:0 0 0 4px rgba(97,108,125,.09)}
    footer{position:absolute;z-index:2;right:0;bottom:22px;left:0;display:flex;align-items:center;justify-content:center;color:#939aa8;font-size:9px;font-weight:700;letter-spacing:.15em}
    @media(max-width:520px){header{padding:19px}.chip{padding:8px 9px;font-size:9px}main{min-height:calc(100vh - 78px);padding-top:16px}.visual{width:min(340px,88vw)}h1{font-size:32px}}
    @media(max-height:680px){main{justify-content:flex-start;padding-top:10px}.visual{width:260px}.eyebrow{margin-top:17px}footer{display:none}}
  </style>
</head>
